# Zufallstest der Codeerzeugung (test/fuzz.js, docs/CODEGEN-PLAN.md Schritt 8): erzeugt zufällige Struktogramme,
# übersetzt sie in alle acht Sprachen, baut und startet sie und vergleicht mit dem Interpreter. Läuft nachts – einmal
# mit festem Seed (wiederholbar, zeigt Rückschritte) und einmal mit zufälligem Seed (findet Neues). Abweichungen liegen
# als .nsd im Artefakt „fuzz-…“ und lassen sich lokal nachstellen: node test/fuzz.js --n 1 --seed <Seed> all
name: Zufallstest

on:
  schedule:
    - cron: '17 2 * * *' # täglich 02:17 UTC
  workflow_dispatch:
    inputs:
      n:
        description: Anzahl Struktogramme je Lauf
        default: '200'

permissions:
  contents: read

env:
  KOTLIN_VERSION: 2.4.21
  STRUKTOGRAMM_LANGUAGE: de

jobs:
  fuzz:
    name: Seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [fest, zufall]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kotlin-Compiler installieren
        run: |
          curl -fsSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: dtolnay/rust-toolchain@stable

      # gcc/g++ sind auf ubuntu-latest vorhanden
      - name: Zufallstest
        run: |
          N="${{ github.event.inputs.n || '200' }}"
          if [ "${{ matrix.seed }}" = "fest" ]; then SEED=1; else SEED=$(( RANDOM * 32768 + RANDOM )); fi
          node test/fuzz.js --n "$N" --seed "$SEED" all

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.seed }}
          path: test/out/fuzz/
          if-no-files-found: ignore
